# UMP FreeBSD rescue system. ump_rescue_setup writes rc.conf.local from
# the boot config (the hostname, the network) before the network starts.
hostname="ump-rescue"
ump_rescue_setup_enable="YES"
ump_rescue_report_enable="YES"
sshd_enable="YES"
sendmail_enable="NONE"
cron_enable="NO"
syslogd_flags="-ss"
# the root is a memory disk: nothing to check, nowhere to dump, and
# nothing kept from one boot to the next
background_fsck="NO"
dumpdev="NO"
entropy_file="NO"
entropy_boot_file="NO"
# ZFS for the installer, and the drivers the GENERIC kernel lacks; no pool
# of the disks is imported
kld_list="zfs"
devmatch_enable="YES"
zfs_enable="NO"
