# UMP FreeBSD rescue system: the kernel with its root in memory. The
# loader takes mfsroot.gz for mfsroot and unpacks it while it loads.
# build.sh adds the console of the architecture.
autoboot_delay="2"
beastie_disable="YES"
boot_multicons="YES"
mfsroot_load="YES"
mfsroot_type="mfs_root"
mfsroot_name="/boot/mfsroot"
vfs.root.mountfrom="ufs:/dev/md0"
vfs.root.mountfrom.options="rw"
kern.geom.label.gptid.enable="0"
